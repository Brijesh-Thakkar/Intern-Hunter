# ── Preferences (hard rules) ─────────────────────────────────────────────────
preferences:
  remote_only: true
  remote_keywords:               # any of these must appear in the listing
    - "remote"
    - "wfh"
    - "work from home"
    - "anywhere in india"
    - "work from anywhere"
  min_stipend: 10000             # ₹/month — reject listings below this (0 = allow any)
  max_applications_per_day: 20
  min_ai_match_score: 70         # lowered to 70 so great jobs aren't filtered
  blacklist_keywords:            # skip jobs containing these terms
    - "unpaid"
    - "no stipend"
    - "equity only"
    - "part-time only"

# ── API Keys ──────────────────────────────────────────────────────────────────
