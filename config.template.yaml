gemini:
  api_key: ""
  model: ""

# ── Mistral AI ────────────────────────────────────────────────────────────────
mistral:
  api_key: ""               # injected from MISTRAL_API_KEY secret
  scoring_model: "mistral-small-latest"
  cover_letter_model: "mistral-small-latest"
  max_cover_letter_words: 150

# ── Google Drive ──────────────────────────────────────────────────────────────
google_drive:
  folder_id: "1Ry8sBinEjwpwhcKLHv7Z8CcP2Wm4RZy2"
  check_interval_minutes: 30
  credentials_path: "credentials/credentials.json"
  token_path: "credentials/token.json"
  scopes:
