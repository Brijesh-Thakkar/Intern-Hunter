# ── Preferences (hard rules) ──────────────────────────────────────────────────
preferences:
  remote_only: true
  remote_keywords:
    - "remote"
    - "wfh"
    - "work from home"
    - "anywhere in india"
    - "work from anywhere"
  min_stipend: 10000
  max_applications_per_day: 20
  min_ai_match_score: 70
  blacklist_keywords:
    - "unpaid"
    - "no stipend"
    - "equity only"
    - "part-time only"

